name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[[routes]]
pattern = "mail.heyuspace.com"
custom_domain = true

[secrets]
required = ["jwt_secret"]

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = "d2e61d96-b194-4318-99cd-aff500dc3a5b"

[[kv_namespaces]]
binding = "kv"
id = "752fc4c1052947919a64ac9fd49b9e60"

#[[r2_buckets]]
#binding = "r2"			# R2 attachment storage; enable the account and create cloud-mail-files first
#bucket_name = "cloud-mail-files"

#[[send_email]]
#name = "email"			# Cloudflare outbound email; Resend remains unconfigured

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
#ai_model = ""
#analysis_cache = false
#orm_log = false
domain = ["heyuspace.com"]
admin = "heyu@heyuspace.com"
# jwt_secret is stored as a Cloudflare Worker Secret and is never committed.

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
